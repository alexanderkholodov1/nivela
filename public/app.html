<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nivela — Plataforma</title>
<meta name="description" content="Entra a Nivela: tu ruta, tu mentor y tus certificados verificables." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='3' y='23' width='9' height='14' rx='4.5' fill='%23A6B2C0'/%3E%3Crect x='15.5' y='14' width='9' height='23' rx='4.5' fill='%2333405C'/%3E%3Crect x='28' y='5' width='9' height='32' rx='4.5' fill='%23F2A93C'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/nivela.css" />
<style>
/* ================= LOGIN ================= */
#login{min-height:100vh;display:grid;grid-template-columns:1fr 1.1fr}
@media(max-width:900px){#login{grid-template-columns:1fr}}
.login-brandside{
  background:var(--brand-navy);color:#EAF1F9;padding:48px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
  /* barras del logo visibles sobre navy en ambos temas */
  --logo1:#8FA0B5;--logo2:#A9C6E0;--logo3:#F2A93C;
}
.login-brandside > *{position:relative;z-index:1}
.login-brandside::after{
  content:"";position:absolute;right:-40px;bottom:-40px;width:340px;height:340px;z-index:0;
  background:
    linear-gradient(180deg,transparent 30%,#F2A93C 30%) 0 0/54px 100% no-repeat,
    linear-gradient(180deg,transparent 52%,#A9C6E0 52%) 70px 0/54px 100% no-repeat,
    linear-gradient(180deg,transparent 68%,#5E7695 68%) 140px 0/54px 100% no-repeat;
  opacity:.16;border-radius:30px;transform:rotate(0);
}
.login-brandside .brand{color:#fff}
.login-brandside h2{color:#fff;font-size:clamp(26px,3vw,36px);max-width:400px;line-height:1.2}
.login-brandside p{opacity:.85;max-width:400px;margin-top:14px;font-size:15px}
@media(max-width:900px){.login-brandside{display:none}}
.login-formside{display:flex;align-items:center;justify-content:center;padding:48px 24px}
.login-box{width:100%;max-width:400px}
.login-box h1{font-size:26px;margin-bottom:6px}
.login-box .sub{font-size:14px;color:var(--muted);margin-bottom:26px}
.demo-sep{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.demo-sep::before,.demo-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.demo-btn{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);
  padding:13px 16px;margin-bottom:10px;transition:all .15s ease;
}
.demo-btn:hover{border-color:var(--accent);box-shadow:var(--shadow-sm)}
.demo-btn .avatar{flex:none}
.demo-btn b{display:block;font-size:14.5px;color:var(--ink)}
.demo-btn span{font-size:12.5px;color:var(--muted)}
.avatar{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--on-accent);background:var(--accent);flex:none;
}
.avatar.gold{background:var(--gold);color:var(--brand-navy)}
.avatar.ink{background:#33415E;color:#fff}
/* las iniciales deben ganar al color heredado de .demo-btn span / .side .userchip span */
.demo-btn .avatar,.side .userchip .avatar{color:var(--on-accent)}
.demo-btn .avatar.gold,.side .userchip .avatar.gold{color:var(--brand-navy)}
.demo-btn .avatar.ink,.side .userchip .avatar.ink{color:#fff}

/* ================= SHELL ================= */
#shell{display:none;min-height:100vh}
#shell.on{display:grid;grid-template-columns:236px 1fr}
@media(max-width:860px){#shell.on{grid-template-columns:1fr}}
aside.side{
  border-right:1px solid var(--line);background:var(--surface);
  padding:20px 14px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
@media(max-width:860px){aside.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line)}}
.side .brand{padding:4px 10px 18px}
.snav{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:none;background:transparent;border-radius:var(--r-sm);
  padding:9px 12px;font-size:14px;font-weight:500;color:var(--muted);transition:all .12s;
}
.snav:hover{color:var(--ink);background:var(--surface-2)}
.snav.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.side .spacer{flex:1}
.side .userchip{display:flex;align-items:center;gap:10px;padding:12px 8px;border-top:1px solid var(--line)}
.side .userchip .uinfo{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.side .userchip b{font-size:13px;color:var(--ink);line-height:1.2}
.side .userchip .urole{font-size:11.5px;color:var(--muted);line-height:1.2}
.side .userchip .logout-btn{flex:none;padding:7px;line-height:0;border-radius:50%}
.side .userchip .logout-btn svg{display:block}

main.main{padding:34px 38px;max-width:1060px}
@media(max-width:860px){main.main{padding:22px 18px}}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:26px}
.view{display:none}
.view.on{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi b{font-family:var(--display);font-size:27px;font-weight:650;color:var(--ink);display:block}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi .delta{font-size:11.5px;font-weight:600;color:var(--good)}

/* ---------- ruta ---------- */
.stage{margin-bottom:26px}
.stage-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stage-h h3{font-size:17px}
.mod{
  display:flex;align-items:flex-start;gap:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;margin-bottom:10px;
}
.mod.now{border-color:var(--accent);box-shadow:var(--shadow-sm)}
.mod.lock{opacity:.62}
.mod .mdot{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:2px}
.mod b{font-size:15px;color:var(--ink);display:block}
.mod .del{font-size:13px;color:var(--muted);margin-top:3px}
.mod .del strong{color:var(--gold);font-weight:600}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 10px}
@media(max-width:700px){.branches{grid-template-columns:1fr}}
.branch{
  border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:16px 18px;cursor:pointer;
  transition:all .15s ease;background:transparent;text-align:left;font-family:var(--body);
}
.branch:hover{border-color:var(--accent)}
.branch.sel{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.branch b{font-size:14.5px;color:var(--ink);display:block;margin-bottom:4px}
.branch span{font-size:13px;color:var(--muted)}

/* ---------- lección ---------- */
.lesson-grid{display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start}
@media(max-width:1000px){.lesson-grid{grid-template-columns:1fr}}
.lesson-body h2{font-size:22px;margin-bottom:4px}
.lesson-body .lmeta{font-size:13px;color:var(--muted);margin-bottom:20px}
.lblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.lblock h4{font-size:15px;margin-bottom:10px}
.lblock p,.lblock li{font-size:14.5px}
.lblock ol{padding-left:20px;display:flex;flex-direction:column;gap:8px}
.term{border-bottom:1.5px dashed var(--accent);cursor:pointer;color:var(--ink);font-weight:500}
.mentor-dock{position:sticky;top:20px}
.mentor-dock .card-pad{display:flex;flex-direction:column;gap:12px;max-height:76vh}
.mentor-log{overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;min-height:180px;max-height:44vh}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{
  border:1px solid var(--accent-line);background:transparent;color:var(--accent-ink);
  border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;
}
.sugg button:hover{background:var(--accent-soft)}
.mentor-in{display:flex;gap:8px}
.mentor-in input{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14.5px}
.check input{margin-top:4px;accent-color:var(--accent)}
.verify-fb{border-left:3px solid var(--good);background:var(--good-soft);border-radius:var(--r-sm);padding:14px 16px;margin-top:14px;font-size:14px;display:none}
.verify-fb.on{display:block}

/* ---------- diccionario ---------- */
.dterm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.dterm b{color:var(--ink);font-size:15px}
.dterm p{font-size:14px;margin-top:4px}

/* ---------- certificado ---------- */
.cert{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);
  padding:28px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);
}
.cert::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:12px;pointer-events:none}
.cert .cbrand{font-family:var(--display);font-weight:650;font-size:15px;color:var(--accent-ink)}
.cert h3{font-size:22px;margin:14px 0 4px}
.cert .cwho{font-size:14px;color:var(--muted)}
.cert .ccode{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:16px}

/* ---------- feed novedades ---------- */
.feed-item{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.feed-item .fdate{flex:none;width:74px;font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
.feed-item b{font-size:15px;color:var(--ink)}
.feed-item p{font-size:14px;margin-top:4px}
.feed-item .why{font-size:13px;color:var(--accent-ink);margin-top:6px;font-weight:500}

/* ---------- estándar B2B ---------- */
.std-sec{margin-bottom:18px}
.std-sec h4{font-size:15px;margin-bottom:10px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- misc ---------- */
.section-note{font-size:13px;color:var(--muted);margin-top:10px}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:11px 14px;font-size:14px;margin-bottom:8px;color:var(--ink)}
.qopt:hover{border-color:var(--accent)}
.qopt.ok{border-color:var(--good);background:var(--good-soft)}
.qopt.bad{border-color:var(--danger)}
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="login">
  <div class="login-brandside">
    <a class="brand" href="index.html">
      <svg class="logo-mark" width="28" height="28" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect class="lb1" x="3" y="23" width="9" height="14" rx="4.5"/>
        <rect class="lb2" x="15.5" y="14" width="9" height="23" rx="4.5"/>
        <rect class="lb3" x="28" y="5" width="9" height="32" rx="4.5"/>
      </svg>
      Nivela
    </a>
    <div>
      <h2 data-i18n="lg_h2">Hoy sales con una tarea tuya resuelta.</h2>
      <p data-i18n="lg_p">Tu mentor ya conoce tu rol, tu nivel y tus brechas. Lo único que falta eres tú.</p>
    </div>
    <span class="small" style="opacity:.7">© 2026 Nivela</span>
  </div>

  <div class="login-formside">
    <div class="login-box">
      <div class="between mb-3">
        <a class="brand" href="index.html" style="font-size:18px">
          <svg class="logo-mark" width="23" height="23" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <rect class="lb1" x="3" y="23" width="9" height="14" rx="4.5"/>
            <rect class="lb2" x="15.5" y="14" width="9" height="23" rx="4.5"/>
            <rect class="lb3" x="28" y="5" width="9" height="32" rx="4.5"/>
          </svg>
          Nivela
        </a>
        <div class="toggles">
          <button class="tgl" data-tgl-lang onclick="toggleLang()">EN</button>
          <button class="tgl" data-tgl-theme onclick="toggleTheme()">Oscuro</button>
        </div>
      </div>
      <h1 data-i18n="lg_title">Entrar a Nivela</h1>
      <p class="sub" data-i18n="lg_sub">Bienvenido de vuelta. Tu ruta te espera.</p>
      <form onsubmit="return fakeLogin(event)">
        <div class="field">
          <label data-i18n="lg_email">Correo</label>
          <input class="input" type="email" placeholder="tu@correo.com" />
        </div>
        <div class="field">
          <label data-i18n="lg_pass">Contraseña</label>
          <input class="input" type="password" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="lg_btn">Entrar</button>
      </form>
      <div class="demo-sep" data-i18n="lg_demo">Explora con una cuenta demo</div>
      <button class="demo-btn" onclick="enter('b2c')">
        <span class="avatar">CR</span>
        <span><b>Camila Ríos</b><span data-i18n="lg_d1">Contadora independiente · Plan Individual</span></span>
      </button>
      <button class="demo-btn" onclick="enter('b2b')">
        <span class="avatar gold">FS</span>
        <span><b>Fernando Salas</b><span data-i18n="lg_d2">Coordinador académico · U. E. Andina (30 puestos)</span></span>
      </button>
      <button class="demo-btn" onclick="enter('admin')">
        <span class="avatar ink">NV</span>
        <span><b>Equipo Nivela</b><span data-i18n="lg_d3">Administración de la plataforma</span></span>
      </button>
    </div>
  </div>
</div>

<!-- ======================= SHELL ======================= -->
<div id="shell">
  <aside class="side">
    <a class="brand" href="index.html">
      <svg class="logo-mark" width="26" height="26" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect class="lb1" x="3" y="23" width="9" height="14" rx="4.5"/>
        <rect class="lb2" x="15.5" y="14" width="9" height="23" rx="4.5"/>
        <rect class="lb3" x="28" y="5" width="9" height="32" rx="4.5"/>
      </svg>
      Nivela
    </a>
    <nav id="sidenav" style="display:contents"></nav>
    <div class="spacer"></div>
    <div class="toggles" style="padding:0 10px 12px">
      <button class="tgl" data-tgl-lang onclick="toggleLang()">EN</button>
      <button class="tgl" data-tgl-theme onclick="toggleTheme()">Oscuro</button>
    </div>
    <div class="userchip">
      <span class="avatar" id="uavatar">CR</span>
      <span class="uinfo"><b id="uname">Camila Ríos</b><span class="urole" id="urole"></span></span>
      <button class="tgl logout-btn" id="logoutbtn" onclick="logout()" aria-label="Salir" title="Salir">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="viewtitle"></h1>
      <span class="chip" id="viewchip"></span>
    </div>
    <div id="views"></div>
  </main>
</div>

<div class="modal-back" id="modalback" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalbox"></div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   Nivela app demo — todo el contenido vive aquí, en ES y EN.
   ============================================================ */

// ---------- i18n del cromo ----------
window.I18N = {
  es: {},
  en: {
    lg_h2:"Today you leave with one of your tasks solved.",
    lg_p:"Your mentor already knows your role, your level and your gaps. The only thing missing is you.",
    lg_title:"Sign in to Nivela", lg_sub:"Welcome back. Your route is waiting.",
    lg_email:"Email", lg_pass:"Password", lg_btn:"Sign in",
    lg_demo:"Explore with a demo account",
    lg_d1:"Independent accountant · Individual plan",
    lg_d2:"Academic coordinator · U. E. Andina (30 seats)",
    lg_d3:"Platform administration",
    s_out:"Log out"
  }
};

// ---------- textos por idioma ----------
const T = {
  es: {
    loginToast:"El registro abre pronto. Mientras tanto, entra con una cuenta demo.",
    planInd:"Plan Individual", org:"U. E. Andina", admin:"Equipo Nivela",
    nav:{home:"Hoy", route:"Mi ruta", lesson:"Lección actual", dict:"Mi diccionario", kit:"Mi kit", news:"Novedades", certs:"Certificados",
         panel:"Panel de adopción", std:"Estándar de uso", routes:"Rutas institucionales", ocerts:"Certificados emitidos",
         adash:"Resumen", acur:"Curaduría", aorgs:"Instituciones", ahealth:"Salud del sistema"},
    chips:{b2c:"Contadora independiente", b2b:"Coordinador académico", admin:"Administración"},
    copied:"Prompt copiado", added:"Agregado a tu diccionario", already:"Ya está en tu diccionario",
    branchSel:"Rama elegida. Tu ruta se actualizó.",
    verifyOk:"Entregable revisado por tu mentor",
    close:"Cerrar", practice:"Practicar", practiceT:"Práctica rápida", pScore:"Resultado",
    pAgain:"Practicar otra vez", pGood:"Tu diccionario está sólido. Estos términos ya son tuyos.",
    pMid:"Bien. Repasa los que fallaste: el mentor los reforzará en tu próxima lección.",
    verifyTitle:"Verificación pública",
    verifyBody:"Este certificado consta en el registro público de Nivela.",
    verifyBy:"Emitido por", verifyTo:"Otorgado a", verifyDate:"Fecha", verifyBranch:"Rama",
    mentorFallback:"Depende de tu caso: si el banco te cambió el formato del extracto, primero pídele a la IA que te muestre cómo interpretó cada columna, y recién ahí concilia. ¿Lo revisamos con tu archivo en la lección?",
    mentorPlaceholder:"Pregúntale al mentor…",
    demoNote:"Cuenta demo: los datos son de muestra.",
    approve:"Aprobar", discard:"Descartar", approved:"Aprobada", discarded:"Descartada", inEval:"En evaluación",
    curToast:"Estado actualizado en el catálogo."
  },
  en: {
    loginToast:"Registration opens soon. Meanwhile, use a demo account.",
    planInd:"Individual plan", org:"U. E. Andina", admin:"Nivela team",
    nav:{home:"Today", route:"My route", lesson:"Current lesson", dict:"My dictionary", kit:"My kit", news:"News", certs:"Certificates",
         panel:"Adoption panel", std:"Usage standard", routes:"Institutional routes", ocerts:"Issued certificates",
         adash:"Overview", acur:"Curation", aorgs:"Institutions", ahealth:"System health"},
    chips:{b2c:"Independent accountant", b2b:"Academic coordinator", admin:"Administration"},
    copied:"Prompt copied", added:"Added to your dictionary", already:"Already in your dictionary",
    branchSel:"Branch selected. Your route was updated.",
    verifyOk:"Deliverable reviewed by your mentor",
    close:"Close", practice:"Practice", practiceT:"Quick practice", pScore:"Score",
    pAgain:"Practice again", pGood:"Your dictionary is solid. These terms are yours now.",
    pMid:"Good. Review the ones you missed: the mentor will reinforce them in your next lesson.",
    verifyTitle:"Public verification",
    verifyBody:"This certificate is on Nivela's public registry.",
    verifyBy:"Issued by", verifyTo:"Granted to", verifyDate:"Date", verifyBranch:"Branch",
    mentorFallback:"It depends on your case: if the bank changed the statement format, first ask the AI to show you how it read each column, and only then reconcile. Shall we review it with your file in the lesson?",
    mentorPlaceholder:"Ask your mentor…",
    demoNote:"Demo account: sample data.",
    approve:"Approve", discard:"Discard", approved:"Approved", discarded:"Discarded", inEval:"In evaluation",
    curToast:"Catalog status updated."
  }
};
const tt = () => T[window.LANG] || T.es;

// ---------- estado ----------
let ROLE = null;
let dictTerms = [];
try { dictTerms = JSON.parse(localStorage.getItem("nivela-dict") || "null") || defaultDict(); } catch(e){ dictTerms = defaultDict(); }
function defaultDict(){
  return [
    {k:"prompt", es:"La instrucción que le das a un modelo de IA. Un buen prompt define el rol, el contexto, el formato esperado y los límites.", en:"The instruction you give an AI model. A good prompt defines role, context, expected format and limits."},
    {k:"modelo de lenguaje", en_k:"language model", es:"Sistema entrenado con texto para producir texto. Distintos modelos rinden distinto según la tarea: por eso eliges, no adivinas.", en:"A system trained on text to produce text. Different models perform differently per task: that's why you choose, not guess."},
    {k:"contexto", en_k:"context", es:"Todo lo que el modelo sabe de tu caso en esta conversación: archivos, instrucciones, historial. Sin contexto, improvisa.", en:"Everything the model knows about your case in this conversation: files, instructions, history. Without context, it improvises."}
  ];
}
function saveDict(){ try{ localStorage.setItem("nivela-dict", JSON.stringify(dictTerms)); }catch(e){} }

let lessonDone = false;
let chosenBranch = null;
try { chosenBranch = localStorage.getItem("nivela-branch") || null; } catch(e){}

// ---------- login/logout ----------
function fakeLogin(ev){ ev.preventDefault(); toast(tt().loginToast); return false; }
function enter(role){
  ROLE = role;

function setLogoutLabel(){
  const lb = document.getElementById("logoutbtn");
  if(!lb) return;
  const t = window.LANG==="es" ? "Salir" : "Log out";
  lb.title = t; lb.setAttribute("aria-label", t);
}
function logout(){
  ROLE = null;
  document.getElementById("shell").classList.remove("on");

// ---------- navegación ----------
const NAVS = { b2c:["home","route","lesson","dict","kit","news","certs"],
               b2b:["panel","std","routes","ocerts"],
               admin:["adash","acur","aorgs","ahealth"] };
let CURRENT = null;
function buildNav(){
  const nav = document.getElementById("sidenav");
  nav.innerHTML = "";
  NAVS[ROLE].forEach(v=>{
    const b = document.createElement("button");
    b.className = "snav"; b.dataset.v = v;
    b.textContent = tt().nav[v];
    b.onclick = ()=>go(v);
    nav.appendChild(b);
  });
}
function go(v){
  CURRENT = v;
  document.querySelectorAll(".snav").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  document.getElementById("viewtitle").textContent = tt().nav[v];
  document.getElementById("viewchip").textContent = tt().chips[ROLE==="b2c"?"b2c":ROLE==="b2b"?"b2b":"admin"];
  render(v);
}
window.onLangChange = function(){
  if (!ROLE) return;
  buildNav(); go(CURRENT);
  document.getElementById("urole").textContent = ROLE==="b2c"?tt().planInd:ROLE==="b2b"?tt().org:tt().admin;
  setLogoutLabel();
};

function el(html){ const d=document.createElement("div"); d.innerHTML=html; return d; }
function copyText(txt){
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(()=>toast(tt().copied))
    .catch(()=>{ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast(tt().copied); });
}
function openModal(html){ document.getElementById("modalbox").innerHTML = html; document.getElementById("modalback").classList.add("open"); }
function closeModal(){ document.getElementById("modalback").classList.remove("open"); }
function L(obj){ return obj[window.LANG] || obj.es; }

function modRow(state, n, title, del){

let quizIdx=0, quizScore=0;
function startQuiz(){ quizIdx=0; quizScore=0; quizStep(); }
function quizStep(){
  if(quizIdx>=QUIZ.length){
    openModal(`<h3 style="margin-bottom:10px">${tt().pScore}: ${quizScore}/${QUIZ.length}</h3>
      <p style="font-size:14.5px">${quizScore===QUIZ.length?tt().pGood:tt().pMid}</p>
      <div class="flex mt-3"><button class="btn btn-outline btn-sm" onclick="startQuiz()">${tt().pAgain}</button>
      <button class="btn btn-primary btn-sm" onclick="closeModal()">${tt().close}</button></div>`);
    return;
  }
  const q = QUIZ[quizIdx];
  openModal(`<span class="chip acc">${tt().practiceT} · ${quizIdx+1}/${QUIZ.length}</span>
    <h3 style="margin:14px 0">${L(q.q)}</h3>
    ${q.opts.map((o,i)=>`<button class="qopt" onclick="quizPick(${i})">${L(o.t)}</button>`).join("")}`);
}
function quizPick(i){
  const q = QUIZ[quizIdx];
  document.querySelectorAll(".qopt").forEach((b,j)=>{
    if(q.opts[j].ok) b.classList.add("ok"); else if(j===i) b.classList.add("bad");
    b.onclick=null;
  });
  if(q.opts[i].ok) quizScore++;
  setTimeout(()=>{ quizIdx++; quizStep(); }, 900);
}
